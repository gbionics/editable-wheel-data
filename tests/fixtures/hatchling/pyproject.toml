[build-system]
requires = ["editable-wheel-data", "hatchling>=1.26"]
build-backend = "editable_wheel_data"

[project]
name = "demo_robot"
version = "1.0.0"

[tool.editable-wheel-data]
backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["demo_robot"]

[tool.hatch.build.targets.wheel.shared-data]
"share" = "share"
